// Стійкий розбір JSON: спершу нормально, потім рятуємо слайди з обрізаної відповіді
function tolerantParse(text) {
  const start = text.indexOf("{"), end = text.lastIndexOf("}");
  if (start !== -1 && end !== -1) {
    try { return JSON.parse(text.slice(start, end + 1)); } catch (e) {}
  }
  // Рятівний режим: витягуємо поля навіть з обрізаного JSON
  const grab = (re) => { const m = text.match(re); return m ? m[1] : ""; };
  const list = (key) => {
    const m = text.match(new RegExp(`"${key}"\\s*:\\s*\\[([\\s\\S]*?)\\]`));
    if (!m) return [];
    return (m[1].match(/"((?:[^"\\]|\\.)*)"/g) || []).map((s) => s.slice(1, -1).replace(/\\"/g, '"'));
  };
  const slides = [];
  const re = /\{\s*"title"\s*:\s*"((?:[^"\\]|\\.)*)"\s*(?:,\s*"body"\s*:\s*"((?:[^"\\]|\\.)*)")?/g;
  let mm;
  while ((mm = re.exec(text)) !== null) {
    slides.push({ title: mm[1].replace(/\\"/g, '"'), body: (mm[2] || "").replace(/\\"/g, '"') });
  }
  if (!slides.length) throw new Error("parse");
  return {
    hooks: list("hooks"),
    slides,
    caption: grab(/"caption"\s*:\s*"((?:[^"\\]|\\.)*)"/),
    hashtags: list("hashtags"),
    cta: grab(/"cta"\s*:\s*"((?:[^"\\]|\\.)*)"/),
  };
}

async function callClaude(prompt, useTools) {
  const res = await fetch("/api/text", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ prompt, secret: NB_SECRET, search: !!useTools }),
  });
  if (!res.ok) throw new Error("net");
  const data = await res.json();
  return data.text || "";
}

// Крок 1: тільки текст каруселі (без картинок) — завжди влазить у ліміт
async function generateText(opts) {
  const text = await callClaude(buildPrompt({ ...opts, images: false }), opts.trends);
  return tolerantParse(text);
}

// Крок 2: окремо — короткі промпти картинок під наявні слайди
async function generateImages({ slides, themeMood, lang, topic }) {
  const langName = lang === "uk" ? "Ukrainian" : lang === "de" ? "German" : "English";
  const titles = slides.map((s, i) => `${i + 1}. ${s.title}`).join("\n");
  const prompt = `Return ONLY a JSON array of ${slides.length} short image prompts, one per slide below.
ALL prompts MUST be written strictly in ${langName} language only — no other language.
The carousel topic is: "${topic}". Each image must clearly relate to the MEANING of its slide and the topic — use symbolic objects, relevant scenes or environments, concrete visual metaphors.
Do NOT insert random people, random women or random faces unless the slide is explicitly about a specific person.
Each prompt: under 20 words, premium cinematic aesthetic (${themeMood}), elegant lighting, clean background with empty space for text overlay.
Vary the shot across slides (close-up, wide, side angle) but keep ONE consistent style.
ABSOLUTELY NO text, no letters, no words, no captions, no watermark in the image.
Slides:
${titles}
Answer with just: ["prompt 1","prompt 2",...] and nothing else.`;
  const text = await callClaude(prompt, false);
  const s = text.indexOf("["), e = text.lastIndexOf("]");
  if (s === -1 || e === -1) return slides.map(() => "");
  try {
    const arr = JSON.parse(text.slice(s, e + 1));
    return slides.map((_, i) => arr[i] || "");
  } catch (err) {
    return slides.map(() => "");
  }
}

    try {
      const html2canvas = await loadScript("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js", "html2canvas");
      const JSZip = await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js", "JSZip");
      const zip = new JSZip();
      for (let i = 0; i < slideRefs.current.length; i++) {
        const node = slideRefs.current[i];
        if (!node) continue;
        const canvas = await html2canvas(node, { scale: 3, useCORS: true, backgroundColor: null });
        const blob = await new Promise((res) => canvas.toBlob(res, "image/png"));
        zip.file(`slide-${String(i + 1).padStart(2, "0")}.png`, blob);

      const txt =
        result.slides.map((s, i) => `Слайд ${i + 1}\n${s.title}${s.body ? "\n" + s.body : ""}`).join("\n\n") +

      zip.file("carousel-text.txt", txt);
      const content = await zip.generateAsync({ type: "blob" });
      const url = URL.createObjectURL(content);
      const a = document.createElement("a");

      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);

    } finally { setDownloading(false); }

          </button>
          <button onClick={surprise} title={ui.surprise}
            style={{ background: SHELL.panel, color: SHELL.ink, border: `1px solid ${SHELL.line}`, borderRadius: 14, padding: "0 16px", fontSize: 20, cursor: "pointer" }}>✦</button>
        </div>

        <p style={{ color: SHELL.sub, fontSize: 12, marginTop: 10, lineHeight: 1.5 }}>
          {uiLang === "en"
            ? "⏱ Generation usually takes 1–3 min. With Nano Banana images — a bit longer."
            : "⏱ Генерація зазвичай 1–3 хв. З картинками Nano Banana — трохи довше."}
        </p>

        {drafts.length > 0 && (
          <div style={{ marginTop: 16 }}>
            <p style={{ fontSize: 12, letterSpacing: 1.5, textTransform: "uppercase", color: SHELL.sub, margin: "0 0 8px" }}>
              {uiLang === "en" ? "Saved drafts" : "Збережені чернетки"}
            </p>
            <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
              {drafts.map((d) => (
                <div key={d.id} style={{ display: "flex", alignItems: "center", gap: 8, background: SHELL.panel, border: `1px solid ${SHELL.line}`, borderRadius: 12, padding: "9px 12px" }}>
                  <button onClick={() => loadDraft(d)} style={{ flex: 1, minWidth: 0, textAlign: "left", background: "none", border: "none", color: SHELL.ink, cursor: "pointer", padding: 0 }}>
                    <span style={{ display: "block", fontSize: 13, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{d.title}</span>
                    <span style={{ fontSize: 11, color: SHELL.sub }}>{d.when}</span>
                  </button>
                  <button onClick={() => deleteDraft(d.id)} title={uiLang === "en" ? "Delete" : "Видалити"}
                    style={{ background: "none", border: "none", color: SHELL.sub, fontSize: 16, cursor: "pointer", flex: "0 0 auto", padding: "0 4px" }}>✕</button>
                </div>
              ))}
            </div>
          </div>
        )}

        {error && <p style={{ color: SHELL.live, fontSize: 13, marginTop: 12 }}>{error}</p>}
        {loading && genStatus && <p style={{ color: SHELL.gold, fontSize: 13, marginTop: 12 }}>{genStatus}</p>}
        {imgMode === "paid" && !accessCode.trim() && result && (
          <p style={{ color: SHELL.sub, fontSize: 12, marginTop: 12, lineHeight: 1.5 }}>
            {uiLang === "en"
              ? "Enter an access code for paid generation — showing a free preview."
              : "Введи код доступу для платної генерації — показую безкоштовний перегляд."}
          </p>
        )}

        {result && (
          <div style={{ marginTop: 26 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
              <span style={{ fontSize: 12, letterSpacing: 1.5, textTransform: "uppercase", color: SHELL.sub }}>
                {result.slides.length} {uiLang === "en" ? "slides" : "слайдів"}
              </span>
              <div style={{ display: "flex", gap: 6 }}>
                <Chip active={viewMode === "grid"} onClick={() => setViewMode("grid")}>{uiLang === "en" ? "Grid" : "Сітка"}</Chip>
                <Chip active={viewMode === "rail"} onClick={() => setViewMode("rail")}>{uiLang === "en" ? "Strip" : "Стрічка"}</Chip>
              </div>
            </div>
            <p style={{ fontSize: 11, color: SHELL.sub, margin: "0 0 12px", lineHeight: 1.5 }}>
              {uiLang === "en"
                ? "💡 Previews look small here — the downloaded slide (1080px) has large, readable text."
                : "💡 Прев'ю тут маленькі — на завантаженому слайді (1080px) текст великий і читабельний."}
            </p>

            {viewMode === "grid" ? (
              <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(190px, 1fr))", gap: 12, marginBottom: 8 }}>
                {result.slides.map((s, i) => (
                  <div key={i} ref={(el) => (slideRefs.current[i] = el)}>
                    <Slide data={s} index={i} total={result.slides.length} theme={theme} variant="grid" ratio={SIZES.find((z) => z.id === ratioId)?.css}
                      isCover={i === 0} isLast={i === result.slides.length - 1}
                      fontCss={fontId === "auto" ? null : FONTS.find((f) => f.id === fontId)?.css}
                      imgSrc={imgMode === "paid" && s.img ? (s.realImg || imgUrl(s.img, i + 1)) : null} />
                  </div>
                ))}
              </div>
            ) : (
              <div ref={railRef} className="rail"
                style={{ display: "flex", gap: 14, overflowX: "auto", scrollSnapType: "x mandatory", padding: "4px 2px 14px", scrollbarWidth: "none" }}>
                {result.slides.map((s, i) => (
                  <div key={i} ref={(el) => (slideRefs.current[i] = el)} style={{ flex: "0 0 auto", scrollSnapAlign: "center" }}>
                    <Slide data={s} index={i} total={result.slides.length} theme={theme} variant="rail" ratio={SIZES.find((z) => z.id === ratioId)?.css}
                      isCover={i === 0} isLast={i === result.slides.length - 1}
                      fontCss={fontId === "auto" ? null : FONTS.find((f) => f.id === fontId)?.css}
                      imgSrc={imgMode === "paid" && s.img ? (s.realImg || imgUrl(s.img, i + 1)) : null} />
                  </div>
                ))}
              </div>
            )}

            <div style={{ display: "flex", gap: 8, marginTop: 10, marginBottom: 4 }}>
              <button onClick={downloadSlides} disabled={downloading}
                style={{ flex: 1, background: SHELL.panel, color: SHELL.ink, border: `1px solid ${SHELL.gold}`, borderRadius: 14, padding: "13px 10px", fontWeight: 600, fontSize: 13, cursor: downloading ? "wait" : "pointer", opacity: downloading ? .7 : 1 }}>
                {downloading ? (uiLang === "en" ? "Packing…" : "Пакую…") : (uiLang === "en" ? "⬇ All (ZIP)" : "⬇ Усі (ZIP)")}
              </button>
              <button onClick={downloadSeparate} disabled={downloading}
                style={{ flex: 1, background: SHELL.panel, color: SHELL.ink, border: `1px solid ${SHELL.line}`, borderRadius: 14, padding: "13px 10px", fontWeight: 600, fontSize: 13, cursor: downloading ? "wait" : "pointer", opacity: downloading ? .7 : 1 }}>
                {downloading ? (uiLang === "en" ? "Saving…" : "Зберігаю…") : (uiLang === "en" ? "⬇ One by one" : "⬇ По одній")}
              </button>
            </div>

            <button onClick={saveDraft}
              style={{ width: "100%", marginBottom: 8, background: "transparent", color: SHELL.sub, border: `1px solid ${SHELL.line}`, borderRadius: 14, padding: "11px", fontWeight: 600, fontSize: 13, cursor: "pointer" }}>
              {copied === "draft" ? (uiLang === "en" ? "Saved ✓" : "Збережено ✓") : (uiLang === "en" ? "💾 Save as draft" : "💾 Зберегти чернетку")}
            </button>

            {imagesOn && result.slides.some((s) => s.img) && (
              <>
                <Label>{imgMode === "paid" ? "Приклад готових картинок Nano Banana" : "Безкоштовний перегляд"}</Label>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 10 }}>
                  {result.slides.filter((s) => s.img).map((s, i) => (
                    <ImageTile key={i} src={s.realImg || imgUrl(s.img, i + 1)} prompt={s.img} idx={i + 1} />
                  ))}
                </div>
                {imgMode === "paid" ? (
                  <p style={{ fontSize: 13, color: SHELL.ink, margin: "-2px 0 16px", lineHeight: 1.5 }}>
                    Готові картинки Nano Banana (модель <b>{nb.label}</b>). Собівартість каруселі: {result.slides.filter((s) => s.img).length} × €{nb.price.toFixed(2)} ={" "}
                    <b style={{ color: SHELL.gold }}>€{(result.slides.filter((s) => s.img).length * nb.price).toFixed(2)}</b>.
                  </p>
                ) : (
                  <p style={{ fontSize: 12, color: SHELL.sub, margin: "-2px 0 16px" }}>
                    Це безкоштовний перегляд. Промпти для точної генерації — у блоці нижче.
                  </p>
                )}
              </>
            )}

            {result.hooks?.length > 1 && (
              <>
                <Label>Варіанти обкладинки</Label>
                <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 14 }}>
                  {result.hooks.map((h, i) => (
                    <button key={i} onClick={() => swapHook(h)}
                      style={{ textAlign: "left", background: SHELL.panel, border: `1px solid ${SHELL.line}`, borderRadius: 12, padding: "11px 13px", color: SHELL.ink, fontSize: 14, cursor: "pointer" }}>{h}</button>
                  ))}
                </div>
              </>
            )}

            {result.caption && (
              <Card title="Підпис до посту" onCopy={() => copy(result.caption, "cap")} copied={copied === "cap"}>{result.caption}</Card>
            )}
            {result.hashtags?.length > 0 && (
              <Card title="Хештеги" onCopy={() => copy(result.hashtags.join(" "), "tags")} copied={copied === "tags"}>{result.hashtags.join("  ")}</Card>
            )}
            {imgMode === "prompts" && imgPrompts && (
              <Card title="Промпти для самостійної генерації (AI Studio)" onCopy={() => copy(imgPrompts, "img")} copied={copied === "img"}>
                <span style={{ whiteSpace: "pre-line", color: SHELL.sub, fontSize: 13 }}>{imgPrompts}</span>
              </Card>
            )}

            <button onClick={() => copy(allText, "all")}
              style={{ width: "100%", marginTop: 6, background: "transparent", color: SHELL.gold, border: `1px solid ${SHELL.gold}`, borderRadius: 14, padding: "13px", fontWeight: 600, fontSize: 14, cursor: "pointer" }}>
              {copied === "all" ? "Скопійовано ✓" : "Копіювати весь текст"}
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

/* ------------------------------------------------------------------ */
/*  ДРІБНІ КОМПОНЕНТИ                                                   */
/* ------------------------------------------------------------------ */

function Label({ children }) {
  return <p style={{ fontSize: 12, letterSpacing: 1.5, textTransform: "uppercase", color: SHELL.sub, margin: "16px 0 8px" }}>{children}</p>;
}
function Row({ children }) {
  return <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 4 }}>{children}</div>;
}
function Chip({ children, active, onClick }) {
  return (
    <button onClick={onClick}
      style={{ padding: "8px 13px", borderRadius: 20, fontSize: 13, cursor: "pointer",
        background: active ? SHELL.gold : SHELL.panel, color: active ? "#141210" : SHELL.ink,
        border: `1px solid ${active ? SHELL.gold : SHELL.line}`, fontWeight: active ? 600 : 400 }}>{children}</button>
  );
}
function Input({ value, onChange, placeholder, textarea }) {
  const props = {
    value, onChange: (e) => onChange(e.target.value), placeholder,
    style: { width: "100%", background: SHELL.panel, color: SHELL.ink, border: `1px solid ${SHELL.line}`, borderRadius: 14, padding: "13px 14px", fontSize: 14, resize: "none", lineHeight: 1.5 },
  };
  return textarea ? <textarea rows={3} {...props} /> : <input {...props} />;
}
function Select({ value, onChange, options }) {
  return (
    <div style={{ position: "relative", marginBottom: 4 }}>
      <select value={value} onChange={(e) => onChange(e.target.value)}
        style={{ width: "100%", appearance: "none", background: SHELL.panel, color: SHELL.ink, border: `1px solid ${SHELL.line}`, borderRadius: 14, padding: "13px 40px 13px 14px", fontSize: 14 }}>
        {options.map(([v, l]) => <option key={v} value={v}>{l}</option>)}
      </select>
      <span style={{ position: "absolute", right: 16, top: 14, color: SHELL.sub, pointerEvents: "none" }}>▾</span>
    </div>
  );
}
function ToggleRow({ on, onToggle, title, sub, color }) {
  return (
    <button onClick={onToggle}
      style={{ width: "100%", display: "flex", alignItems: "center", justifyContent: "space-between",
        background: SHELL.panel, border: `1px solid ${on ? color : SHELL.line}`, borderRadius: 14,
        padding: "13px 14px", color: SHELL.ink, cursor: "pointer", margin: "10px 0 0" }}>
      <span style={{ textAlign: "left" }}>
        <span style={{ fontWeight: 600, fontSize: 14 }}>{title}</span>
        <span style={{ display: "block", fontSize: 12, color: SHELL.sub }}>{sub}</span>
      </span>
      <span style={{ width: 44, height: 26, borderRadius: 20, background: on ? color : SHELL.line, position: "relative", transition: ".2s", flex: "0 0 auto" }}>
        <span style={{ position: "absolute", top: 3, left: on ? 21 : 3, width: 20, height: 20, borderRadius: 20, background: "#fff", transition: ".2s" }} />
      </span>
    </button>
  );
}
function ThemeCard({ th, active, onClick, fontCss }) {
  return (
    <button onClick={onClick} title={th.name}
      style={{ flex: "0 0 auto", width: 92, cursor: "pointer", background: "none", border: "none", padding: 0 }}>
      <div style={{
        width: 92, height: 116, borderRadius: 12, background: th.bg, overflow: "hidden",
        border: `2px solid ${active ? SHELL.gold : "transparent"}`, boxShadow: "0 6px 18px rgba(0,0,0,.4)",
        padding: 10, display: "flex", flexDirection: "column", justifyContent: "space-between", textAlign: "left",
      }}>
        <span style={{ width: 16, height: 2, background: th.accent, borderRadius: 2 }} />
        <span style={{ fontFamily: fontCss || th.font, color: th.ink, fontSize: 13, lineHeight: 1.1, fontWeight: 600 }}>
          Твій<br />текст
        </span>
        <span style={{ fontSize: 16, color: th.accent, lineHeight: 1 }}>→</span>
      </div>
      <span style={{ display: "block", fontSize: 11, color: active ? SHELL.gold : SHELL.sub, marginTop: 5, textAlign: "center" }}>{th.name}</span>
    </button>
  );
}

function FontCard({ label, css, active, onClick }) {
  return (
    <button onClick={onClick} title={label}
      style={{ flex: "0 0 auto", width: 78, cursor: "pointer", background: "none", border: "none", padding: 0 }}>
      <div style={{
        width: 78, height: 78, borderRadius: 12, background: SHELL.panel,
        border: `2px solid ${active ? SHELL.gold : SHELL.line}`,
        display: "flex", alignItems: "center", justifyContent: "center",
      }}>
        <span style={{ fontFamily: css, color: SHELL.ink, fontSize: 30, lineHeight: 1 }}>Аа</span>
      </div>
      <span style={{ display: "block", fontSize: 10, color: active ? SHELL.gold : SHELL.sub, marginTop: 5, textAlign: "center", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{label}</span>
    </button>
  );
}

function ImgModeBtn({ active, onClick, title, sub, badge, badgeColor }) {
  return (
    <button onClick={onClick}
      style={{
        width: "100%", display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10,
        background: active ? "#17150F" : SHELL.panel,
        border: `1.5px solid ${active ? SHELL.gold : SHELL.line}`, borderRadius: 14,
        padding: "12px 14px", color: SHELL.ink, cursor: "pointer", textAlign: "left",
        boxShadow: active ? `inset 3px 0 0 ${SHELL.gold}` : "none",
      }}>
      <span>
        <span style={{ fontWeight: active ? 700 : 600, fontSize: 14 }}>{title}</span>
        <span style={{ display: "block", fontSize: 12, color: SHELL.sub, marginTop: 2 }}>{sub}</span>
      </span>
      <span style={{ display: "flex", alignItems: "center", gap: 8, flex: "0 0 auto" }}>
        {badge && (
          <span style={{ fontSize: 11, fontWeight: 700, color: "#141210", background: badgeColor, borderRadius: 10, padding: "3px 8px", whiteSpace: "nowrap" }}>{badge}</span>
        )}
        <span style={{ width: 22, height: 22, borderRadius: 7, border: `2px solid ${active ? SHELL.gold : SHELL.line}`, background: active ? SHELL.gold : "transparent", display: "flex", alignItems: "center", justifyContent: "center", color: "#141210", fontSize: 14, fontWeight: 800 }}>
          {active ? "✓" : ""}
        </span>
      </span>
    </button>
  );
}

function DemoSlide({ bg, orb, img, title }) {
  const [ok, setOk] = useState(true);
  return (
    <div style={{ position: "relative", aspectRatio: "4 / 5", borderRadius: 10, overflow: "hidden", background: bg, border: `1px solid ${SHELL.line}`, containerType: "inline-size" }}>
      <span style={{ position: "absolute", top: "12%", left: "50%", transform: "translateX(-50%)", width: "54%", aspectRatio: "1", borderRadius: "50%", background: orb }} />
      {ok && img && (
        <img src={img} alt="" loading="lazy" onError={() => setOk(false)}
          style={{ position: "absolute", inset: 0, width: "100%", height: "100%", objectFit: "cover" }} />
      )}
      <span style={{ position: "absolute", inset: 0, background: "linear-gradient(180deg, rgba(0,0,0,0) 30%, rgba(0,0,0,.90) 100%)" }} />
      <span style={{ position: "absolute", left: "7%", right: "7%", bottom: "7%" }}>
        <span style={{ display: "block", width: "20%", height: "3cqw", maxHeight: 4, background: SHELL.gold, borderRadius: 2, marginBottom: "5%" }} />
        <span style={{ display: "block", fontFamily: "'Cormorant Garamond', serif", color: "#fff", fontSize: "clamp(13px, 12cqw, 26px)", fontWeight: 700, lineHeight: 1.1, textShadow: "0 2px 10px rgba(0,0,0,.95)" }}>{title}</span>
      </span>
    </div>
  );
}

function ImageTile({ src, prompt, idx }) {
  const [state, setState] = useState("load"); // load | ok | err
  return (
    <div style={{ position: "relative", aspectRatio: "4 / 5", borderRadius: 12, overflow: "hidden", background: SHELL.panel, border: `1px solid ${SHELL.line}` }}>
      {state !== "err" ? (
        <a href={src} target="_blank" rel="noreferrer" style={{ display: "block", width: "100%", height: "100%" }}>
          <img src={src} alt={"Слайд " + idx} loading="lazy"
            onLoad={() => setState("ok")} onError={() => setState("err")}
            style={{ width: "100%", height: "100%", objectFit: "cover", opacity: state === "ok" ? 1 : 0, transition: "opacity .4s" }} />
        </a>
      ) : (
        <div style={{ padding: 12, fontSize: 11, color: SHELL.sub, lineHeight: 1.4 }}>
          Картинку не вдалось показати тут. Промпт: {prompt}
        </div>
      )}
      {state === "load" && (
        <span style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center", color: SHELL.sub, fontSize: 12 }}>
          малюю…
        </span>
      )}
      <span style={{ position: "absolute", top: 6, left: 8, fontSize: 11, color: "#fff", background: "rgba(0,0,0,.5)", padding: "2px 7px", borderRadius: 10 }}>{idx}</span>
    </div>
  );
}

function Card({ title, children, onCopy, copied }) {
  return (
    <div style={{ background: SHELL.panel, border: `1px solid ${SHELL.line}`, borderRadius: 14, padding: 14, marginBottom: 10 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
        <span style={{ fontSize: 12, letterSpacing: 1.5, textTransform: "uppercase", color: SHELL.sub }}>{title}</span>
        <button onClick={onCopy} style={{ background: "none", border: "none", color: copied ? SHELL.gold : SHELL.sub, fontSize: 13, cursor: "pointer" }}>{copied ? "✓" : "копіювати"}</button>
      </div>
      <p style={{ margin: 0, fontSize: 14, lineHeight: 1.55, color: SHELL.ink }}>{children}</p>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(App));
</script>
</body>
</html>
